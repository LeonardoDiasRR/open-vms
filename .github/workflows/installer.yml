name: Installer

on:
  push:
    branches: [main, 'fix/**']
    paths:
      - .github/workflows/installer.yml
      - .dockerignore
      - Dockerfile
      - Dockerfile.ghcr
      - docker-compose.yml
      - conf/config.yaml
      - 'deploy/**'
      - install.sh
      - scripts/install-ffmpeg.sh
      - 'scripts/test-install*.sh'
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/installer.yml
      - .dockerignore
      - Dockerfile
      - Dockerfile.ghcr
      - docker-compose.yml
      - conf/config.yaml
      - 'deploy/**'
      - install.sh
      - scripts/install-ffmpeg.sh
      - 'scripts/test-install*.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Test the installer and FFmpeg retry logic
        run: |
          for script in install.sh scripts/install-ffmpeg.sh scripts/test-install*.sh; do bash -n "$script"; done
          shellcheck install.sh scripts/install-ffmpeg.sh scripts/test-install*.sh
          bash scripts/test-install.sh
          bash scripts/test-install-ffmpeg.sh
      - name: Verify anonymous GHCR installation and pull recovery on a clean daemon
        timeout-minutes: 42
        shell: bash
        run: |
          set -euo pipefail
          # The installer uses host networking and fixed names. Keep both the Docker store
          # and the services' loopback in DinD; never mount the runner's Docker socket.
          dind=$(docker run --detach --privileged --env DOCKER_TLS_CERTDIR= --volume "$GITHUB_WORKSPACE:/src:ro" \
            docker:29-dind --host=unix:///var/run/docker.sock)
          cleanup() {
            local rc=$?
            trap - EXIT
            if (( rc != 0 )); then timeout 20s docker logs --tail 100 "$dind" >&2 || true; fi
            timeout 30s docker rm --force --volumes "$dind" || rc=1
            exit "$rc"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          deadline=$((SECONDS + 90))
          until timeout 5s docker exec "$dind" docker info >/dev/null 2>&1; do
            if (( SECONDS >= deadline )); then printf 'DinD did not start in time\n' >&2; exit 1; fi
            sleep 1
          done
          timeout 120s docker exec "$dind" apk add --no-cache bash coreutils curl iproute2 python3
          timeout --kill-after=10s 36m docker exec --env OPENVMS_E2E_ISOLATED=1 "$dind" \
            bash /src/scripts/test-install-ghcr.sh /src
