server {
  listen 7102;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    # §9 (F3): as rotas binarias de midia aceitam `?token=` (limitacao do <video>, que nao manda
    # header). O log default grava a request line inteira — a query inclusive —, entao o acesso a
    # API nao entra no access_log. O erro continua registrado (error_log nao e afetado).
    access_log off;
    proxy_pass http://127.0.0.1:7101;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
